# ==============================================================================
# Airutil Nginx Reverse Proxy Configuration
#
# OS Concepts Demonstrated:
# 1. Reverse Proxying & Network Multiplexing: Single ingress boundary routing
#    traffic across isolated container network namespaces (vault_net).
# 2. Layer 7 Load Balancing: Round-robin distribution between identical Flask
#    worker replicas (app1, app2) ensuring high availability.
# 3. Rate Limiting (Token Bucket Algorithm): Leaky bucket / token bucket
#    mitigates DDoS and resource exhaustion at the gateway boundary.
# 4. Stream Compression & TCP Buffer Tuning: Gzip in-kernel compression reduces
#    network I/O transfer size and socket transmission latency.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format capturing backend latency and upstream routing
    log_format airutil_log '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" upstream: $upstream_addr '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log airutil_log;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # OS Concept: Memory buffer and resource constraints
    client_max_body_size 100m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # OS Concept: Token bucket rate limiting algorithm (20 req/s, 10MB memory state)
    limit_req_zone $binary_remote_addr zone=airutil_rate_limit:10m rate=20r/s;
    limit_req_status 429;

    # Upstream definition for round-robin load balancing
    upstream airutil_backend {
        server app1:5000 max_fails=3 fail_timeout=10s;
        server app2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name localhost;

        # Add header exposing which upstream replica answered the request
        add_header X-Served-By $upstream_addr always;

        # Rate limiting applied globally with burst allowance
        limit_req zone=airutil_rate_limit burst=30 nodelay;

        # Internal Nginx health endpoint
        location /nginx-healthz {
            access_log off;
            default_type text/plain;
            return 200 "nginx ok\n";
        }

        # Health probe endpoint passing to backend
        location /healthz {
            proxy_pass http://airutil_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Application root and API proxy
        location / {
            proxy_pass http://airutil_backend;
            proxy_http_version 1.1;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Upstream failover configuration
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
