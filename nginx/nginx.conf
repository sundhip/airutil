# ==============================================================================
# Airutil Nginx Reverse Proxy Configuration
#
# OS Concepts Demonstrated:
# 1. Reverse Proxying & Network Multiplexing: Single ingress boundary routing
#    traffic across isolated container network namespaces (vault_net).
# 2. Layer 7 Load Balancing: Round-robin distribution between identical Flask
#    worker replicas (app1, app2) ensuring high availability.
# 3. Rate & Connection Limiting: Leaky bucket rate limiting (20 r/s) and connection
#    limits (20 per IP) prevent DDoS and resource exhaustion.
# 4. Stream Compression & TCP Buffer Tuning: Gzip in-kernel compression reduces
#    network I/O transfer size and socket transmission latency.
# 5. Kernel Defense in Depth: Comprehensive CSP, HSTS, frame denial, and nosniff.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format capturing backend latency and upstream routing
    log_format airutil_log '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" upstream: $upstream_addr '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log airutil_log;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # OS Concept: Memory buffer and resource constraints
    client_max_body_size 100m;

    # Security Timeouts (prevent slowloris attacks)
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # OS Concept: Token bucket rate limiting (20 req/s, 10MB memory state) & Connection cap
    limit_req_zone $binary_remote_addr zone=airutil_rate_limit:10m rate=20r/s;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=airutil_conn_limit:10m;
    limit_conn_status 429;

    # Upstream definition for round-robin load balancing
    upstream airutil_backend {
        server app1:5000 max_fails=3 fail_timeout=10s;
        server app2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name localhost;

        # Hardened Security Headers
        add_header X-Served-By $upstream_addr always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.qrserver.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # Connection and Request Rate Limiting
        limit_conn airutil_conn_limit 20;
        limit_req zone=airutil_rate_limit burst=60 nodelay;

        # Internal Nginx health endpoint
        location /nginx-healthz {
            access_log off;
            default_type text/plain;
            return 200 "nginx ok\n";
        }

        # Health probe endpoint passing to backend
        location /healthz {
            proxy_pass http://airutil_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Long-cache headers for static assets
        location /static/ {
            proxy_pass http://airutil_backend/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Served-By $upstream_addr always;
        }

        # Server-Sent Events (SSE) streaming for Docker Terminal Showcase
        location /api/terminal/run {
            proxy_pass http://airutil_backend/api/terminal/run;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Application root and API proxy
        location / {
            proxy_pass http://airutil_backend;
            proxy_http_version 1.1;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Upstream failover configuration
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
