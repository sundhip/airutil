name: Airutil CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Lint, Test & OS Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose Specification
        run: |
          docker compose config --quiet

      - name: Launch Multi-Container Cluster
        run: |
          cp .env.example .env
          docker compose up -d --build
          # Wait for PostgreSQL & Redis healthchecks
          timeout 60s bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'
          sleep 5

      - name: Run Pytest Test Suite & Coverage
        run: |
          docker compose exec -T app1 pytest -o cache_dir=/tmp/.pytest_cache --cov=app --cov-report=term-missing tests/

      - name: Verify OS Kernel & Container Limits
        run: |
          bash scripts/verify_os.sh

      - name: Run Round-Robin Load Test
        run: |
          bash scripts/load_test.sh 50 http://localhost:8080/health

      - name: Security Vulnerability Audit
        run: |
          docker compose exec -T app1 pip-audit --desc || true

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down -v
